name: Publish English Site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare English-only static site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp en/index.html _site/index.html
          cp styles.css script.js _site/
          cp -r assets _site/assets
          cp -r publications _site/publications

          for slug in arenas regulatory-intermediaries arqjud pesquisa-agentiva labjus; do
            mkdir -p "_site/projects/$slug/en"
            cp "projects/$slug/en/index.html" "_site/projects/$slug/en/index.html"
            # In the repository the English home lives in en/; on the site it is the root.
            sed -i 's|\.\./\.\./\.\./en/|../../../|g' "_site/projects/$slug/en/index.html"

            cat > "_site/projects/$slug/index.html" <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=en/">
            <link rel="canonical" href="en/">
            <title>Project</title>
          </head>
          <body><a href="en/">Continue to the project page</a></body>
          </html>
          EOF
          done

          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
