name: Publish English Site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare English-only static site
        shell: bash
        run: |
          # The repository root is the site. Copy only the public files.
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css script.js .nojekyll _site/
          cp -r assets publications _site/
          mkdir -p _site/en && cp en/index.html _site/en/
          for slug in arenas regulatory-intermediaries arqjud pesquisa-agentiva labjus; do
            mkdir -p "_site/projects/$slug/en"
            cp "projects/$slug/index.html" "_site/projects/$slug/index.html"
            cp "projects/$slug/en/index.html" "_site/projects/$slug/en/index.html"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
