name: Generate full academic profile PDF
# CV source: current public site without postdoctoral references

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'assets/**'
      - '.github/workflows/generate-cv-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start local site
        run: |
          python3 -m http.server 8000 >/tmp/site.log 2>&1 &
          sleep 2

      - name: Generate full academic profile PDF from current site
        run: |
          chromium --headless --no-sandbox --disable-gpu \
            --print-to-pdf="$GITHUB_WORKSPACE/Igor_Caires_Machado_CV.pdf" \
            --print-to-pdf-no-header \
            "http://127.0.0.1:8000/"

      - name: Validate PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Igor_Caires_Machado_CV.pdf')
          assert p.exists() and p.stat().st_size > 10000
          assert p.read_bytes()[:5] == b'%PDF-'
          print('Validated academic profile PDF:', p.stat().st_size, 'bytes')
          PY

      - name: Commit refreshed PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Igor_Caires_Machado_CV.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Update full academic profile PDF"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload complete site including PDF
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
