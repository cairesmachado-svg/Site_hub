name: Generate CV PDF

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Igor_Caires_Machado_CV.pdf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start local site
        run: |
          python3 -m http.server 8000 >/tmp/site.log 2>&1 &
          echo $! > /tmp/site.pid
          sleep 2
      - name: Generate current CV PDF
        run: |
          chromium --headless --no-sandbox --disable-gpu \
            --print-to-pdf="$GITHUB_WORKSPACE/Igor_Caires_Machado_CV.pdf" \
            --print-to-pdf-no-header \
            "http://127.0.0.1:8000/#cv"
      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Igor_Caires_Machado_CV.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update generated CV PDF"
          git push
